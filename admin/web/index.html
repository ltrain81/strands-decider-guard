<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PII Guard Console</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 data-i18n="title"></h1>
  <span class="ver" id="ver"></span>
  <span class="user">
    <span class="lang" id="lang"><button data-lang="en">EN</button><button data-lang="ko">한국어</button></span>
    <span id="who"></span><button class="btn ghost" id="logout" data-i18n="logout" hidden></button>
  </span>
</header>
<nav id="tabs">
  <button data-t="overview" class="on" data-i18n="tab_overview"></button>
  <button data-t="policy" data-i18n="tab_policy"></button>
  <button data-t="test" data-i18n="tab_test"></button>
  <button data-t="logs" data-i18n="tab_logs"></button>
  <button data-t="alerts" data-i18n="tab_alerts"></button>
  <button data-t="history" data-i18n="tab_history"></button>
</nav>

<main>
  <!-- Overview: health, KPIs, charts -->
  <section class="tab on" id="t-overview">
    <div class="toolbar">
      <select id="ov-hours"><option value="1" data-i18n="h1"></option><option value="24" selected data-i18n="h24"></option><option value="168" data-i18n="d7"></option><option value="720" data-i18n="d30"></option></select>
      <button class="btn" id="ov-refresh" data-i18n="refresh"></button>
      <label class="check"><input type="checkbox" id="ov-auto"> <span data-i18n="auto_refresh"></span></label>
    </div>
    <div class="grid4" id="health"></div>
    <div class="grid5" id="kpis"></div>
    <div class="grid2">
      <div class="card"><h2 data-i18n="ch_decisions"></h2><p class="sub" id="ch-decisions-sub"></p><div id="ch-decisions"></div></div>
      <div class="card"><h2 data-i18n="ch_latency"></h2><p class="sub" data-i18n="ch_latency_sub"></p><div id="ch-latency"></div></div>
    </div>
    <div class="grid2">
      <div class="card"><h2 data-i18n="by_cat"></h2><p class="sub" data-i18n="by_cat_sub"></p><div class="bars" id="by-cat"></div></div>
      <div class="card"><h2 data-i18n="by_client"></h2><p class="sub" data-i18n="by_client_sub"></p><div class="bars" id="by-client"></div></div>
    </div>
    <div class="card">
      <div class="toolbar" style="margin:0 0 6px"><h2 style="margin:0" data-i18n="recent"></h2><span class="spacer"></span><button class="btn ghost small" id="ov-to-logs" data-i18n="view_logs"></button></div>
      <div id="recent"></div>
    </div>
  </section>

  <!-- Policy editor -->
  <section class="tab" id="t-policy">
    <div class="banner" id="loaded-banner"></div>
    <div class="card"><h2 data-i18n="sens_title"></h2><p class="sub" data-i18n="sens_sub"></p><div class="grid3" id="sens"></div></div>
    <div class="card">
      <h2 data-i18n="cats_title"></h2><p class="sub" data-i18n="cats_sub"></p>
      <div class="legend"><span data-i18n-html="legend_block"></span><span data-i18n-html="legend_ask"></span><span data-i18n-html="legend_allow"></span></div>
      <div id="cats"></div>
    </div>
    <div class="card">
      <h2 data-i18n="rules_title"></h2><p class="sub" data-i18n-html="rules_sub"></p>
      <div class="tpl" id="tpl"></div><div id="rules"></div>
      <button class="btn" id="add-rule" data-i18n="add_rule"></button><p class="hint" data-i18n="rules_tip"></p>
    </div>
    <div class="card">
      <h2 data-i18n="allow_title"></h2><p class="sub" data-i18n="allow_sub"></p>
      <label class="f" data-i18n="allow_domains"></label><div class="chips" data-list="email_domains"><input data-i18n-ph="allow_domains_ph"></div>
      <label class="f" data-i18n="allow_terms"></label><div class="chips" data-list="terms"><input data-i18n-ph="allow_terms_ph"></div>
    </div>
    <div class="card"><h2 data-i18n="msg_title"></h2><p class="sub" data-i18n="msg_sub"></p><textarea id="message" data-i18n-ph="msg_ph"></textarea></div>
  </section>

  <!-- Test a draft policy -->
  <section class="tab" id="t-test">
    <div class="card">
      <h2 data-i18n="test_title"></h2><p class="sub" data-i18n-html="test_sub"></p>
      <div class="tpl" id="samples"></div>
      <textarea id="test-text" rows="7" data-i18n-ph="test_ph"></textarea>
      <div style="margin-top: 10px"><button class="btn primary" id="run-test" data-i18n="run_test"></button></div>
    </div>
    <div class="card" id="test-result" hidden></div>
  </section>

  <!-- Decision log + admin activity -->
  <section class="tab" id="t-logs">
    <div class="card">
      <h2 data-i18n="logs_title"></h2><p class="sub" data-i18n="logs_sub"></p>
      <div class="toolbar">
        <select id="lg-hours"><option value="1" data-i18n="h1"></option><option value="24" selected data-i18n="h24"></option><option value="168" data-i18n="d7"></option><option value="720" data-i18n="d30"></option></select>
        <select id="lg-decision"><option value="" data-i18n="f_decision_all"></option><option value="block" data-i18n="v_block"></option><option value="ask" data-i18n="v_ask"></option><option value="allow" data-i18n="v_allow"></option></select>
        <select id="lg-client"><option value="" data-i18n="f_tool_all"></option></select>
        <select id="lg-category"><option value="" data-i18n="f_cat_all"></option></select>
        <input type="text" id="lg-q" data-i18n-ph="f_search_ph" style="flex:1;min-width:200px">
        <button class="btn primary" id="lg-search" data-i18n="search"></button>
        <button class="btn" id="lg-export" data-i18n="export"></button>
      </div>
      <div id="logs"></div>
    </div>
    <div class="card"><h2 data-i18n="activity_title"></h2><p class="sub" data-i18n="activity_sub"></p><div id="activity"></div></div>
  </section>

  <!-- Alerts -->
  <section class="tab" id="t-alerts">
    <div class="card">
      <h2 data-i18n="al_title"></h2><p class="sub" data-i18n="al_sub"></p>
      <div id="alerts"></div>
    </div>
  </section>

  <!-- History -->
  <section class="tab" id="t-history">
    <div class="card"><h2 data-i18n="hist_title"></h2><p class="sub" data-i18n="hist_sub"></p><div id="versions"></div></div>
  </section>
</main>

<div class="savebar" id="savebar">
  <span class="msg" data-i18n="unsaved"></span>
  <button class="btn ghost" id="discard" data-i18n="discard"></button>
  <button class="btn primary" id="save" data-i18n="save"></button>
</div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<script src="i18n.js"></script>
<script src="samples.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
