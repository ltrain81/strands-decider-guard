<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PII Guard Policy Console</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f6f4; --surface: #fcfcfb; --surface-2: #f0efec; --line: #e2e1dc;
    --text: #0b0b0b; --text-2: #52514e; --text-3: #7a7974;
    --accent: #2a78d6; --accent-weak: #e6f0fc;
    --series-1: #2a78d6;
    --good: #0ca30c; --warning: #fab219; --critical: #d03b3b;
    --good-bg: #e7f6e7; --warning-bg: #fef4dc; --critical-bg: #fbe9e9;
    --radius: 10px;
  }
  * { box-sizing: border-box }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif }
  header { background: var(--surface); border-bottom: 1px solid var(--line); padding: 14px 28px; display: flex; align-items: center; gap: 16px }
  header h1 { font-size: 17px; margin: 0 }
  header .ver { color: var(--text-3); font-size: 13px }
  header .user { margin-left: auto; color: var(--text-2); font-size: 13px; display: flex; gap: 10px; align-items: center }
  nav { background: var(--surface); border-bottom: 1px solid var(--line); padding: 0 20px; display: flex; gap: 4px }
  nav button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 12px 14px; font: inherit; color: var(--text-2); cursor: pointer }
  nav button.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600 }
  main { max-width: 980px; margin: 0 auto; padding: 24px 20px 120px }
  section.tab { display: none } section.tab.on { display: block }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 18px }
  h2 { font-size: 16px; margin: 0 0 4px } .sub { color: var(--text-2); font-size: 13.5px; margin: 0 0 16px }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px }
  @media (max-width: 760px) { .grid3 { grid-template-columns: 1fr } }
  .choice { border: 1.5px solid var(--line); border-radius: var(--radius); padding: 14px; cursor: pointer; background: var(--surface) }
  .choice.on { border-color: var(--accent); background: var(--accent-weak) }
  .choice b { display: block; margin-bottom: 4px }
  .choice span { color: var(--text-2); font-size: 13px }
  .cat { display: flex; align-items: center; gap: 16px; padding: 12px 0; border-top: 1px solid var(--line) }
  .cat:first-of-type { border-top: 0 }
  .cat .info { flex: 1 } .cat .info b { display: block } .cat .info span { color: var(--text-2); font-size: 13px }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-shrink: 0 }
  .seg button { border: 0; background: var(--surface); padding: 7px 14px; font: inherit; font-size: 14px; cursor: pointer; color: var(--text-2); border-left: 1px solid var(--line) }
  .seg button:first-child { border-left: 0 }
  .seg button.on[data-v=block] { background: var(--critical-bg); color: #8c1d1d; font-weight: 600 }
  .seg button.on[data-v=ask] { background: var(--warning-bg); color: #7a5300; font-weight: 600 }
  .seg button.on[data-v=allow] { background: var(--good-bg); color: #0b5e0b; font-weight: 600 }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--text-2); margin-bottom: 8px }
  .rule { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; background: var(--surface) }
  .rule.off { opacity: .55 }
  .rule .row { display: flex; gap: 10px; align-items: center; margin-bottom: 8px }
  input[type=text], textarea, select { font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #fff; color: var(--text); width: 100% }
  textarea { resize: vertical; min-height: 64px }
  select { width: auto }
  .btn { white-space: nowrap; font: inherit; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; cursor: pointer; color: var(--text) }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600 }
  .btn.ghost { border-color: transparent; color: var(--text-2) }
  .btn:disabled { opacity: .5; cursor: default }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; border: 1px solid var(--line); border-radius: 8px; background: #fff; min-height: 42px }
  .chip { background: var(--surface-2); border-radius: 14px; padding: 3px 6px 3px 10px; font-size: 13.5px; display: flex; align-items: center; gap: 4px }
  .chip button { border: 0; background: none; cursor: pointer; color: var(--text-3); font-size: 15px; line-height: 1 }
  .chips input { border: 0; flex: 1; min-width: 160px; padding: 4px; outline: none }
  .tpl { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 14px }
  .tpl button { font: inherit; font-size: 13px; border: 1px dashed var(--line); background: none; border-radius: 14px; padding: 4px 10px; cursor: pointer; color: var(--text-2) }
  .hint { color: var(--text-3); font-size: 12.5px; margin-top: 6px }
  label.f { display: block; font-size: 13px; color: var(--text-2); margin: 12px 0 4px }
  .savebar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 28px; display: none; align-items: center; gap: 12px; box-shadow: 0 -4px 16px rgba(0,0,0,.05) }
  .savebar.on { display: flex } .savebar .msg { flex: 1; color: var(--text-2) }
  .banner { background: var(--accent-weak); border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; font-size: 14px; display: none }
  .banner.on { display: block }
  .verdict { display: inline-flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 700; padding: 8px 16px; border-radius: 8px }
  .verdict.block { background: var(--critical-bg); color: #8c1d1d } .verdict.ask { background: var(--warning-bg); color: #7a5300 } .verdict.allow { background: var(--good-bg); color: #0b5e0b }
  .verdict i { font-style: normal; width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 15px }
  .verdict.block i { background: var(--critical) } .verdict.ask i { background: var(--warning); color: #3b2a00 } .verdict.allow i { background: var(--good) }
  ul.reasons { margin: 14px 0 0; padding-left: 20px } ul.reasons li { margin: 4px 0 }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 18px }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px }
  .tile .k { color: var(--text-2); font-size: 13px; display: flex; align-items: center; gap: 6px }
  .tile .v { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px }
  .dot { width: 9px; height: 9px; border-radius: 50% } .dot.block { background: var(--critical) } .dot.ask { background: var(--warning) }
  .bars .b { display: grid; grid-template-columns: 170px 1fr 48px; gap: 10px; align-items: center; padding: 5px 0; cursor: default }
  .bars .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px }
  .bars .track { height: 16px; position: relative }
  .bars .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--series-1); border-radius: 0 4px 4px 0; min-width: 2px }
  .bars .b:hover .fill { filter: brightness(1.12) }
  .bars .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); font-size: 14px }
  .empty { color: var(--text-3); font-size: 14px; padding: 8px 0 }
  table { width: 100%; border-collapse: collapse; font-size: 14px }
  th { text-align: left; color: var(--text-2); font-weight: 500; font-size: 13px; padding: 8px; border-bottom: 1px solid var(--line) }
  td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top }
  td.num { font-variant-numeric: tabular-nums; text-align: right }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600 }
  .tip { position: fixed; pointer-events: none; background: #0b0b0b; color: #fff; font-size: 13px; padding: 6px 9px; border-radius: 6px; display: none; z-index: 10 }
  .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: #0b0b0b; color: #fff; padding: 10px 16px; border-radius: 8px; display: none; z-index: 20 }
  .err { color: var(--critical) }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden }
  .lang button { border: 0; background: var(--surface); padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; color: var(--text-2) }
  .lang button.on { background: var(--accent-weak); color: var(--text); font-weight: 600 }
</style>
</head>
<body>
<header>
  <h1 data-i18n="title"></h1>
  <span class="ver" id="ver"></span>
  <span class="user">
    <span class="lang" id="lang"><button data-lang="en">EN</button><button data-lang="ko">한국어</button></span>
    <span id="who"></span><button class="btn ghost" id="logout" data-i18n="logout" hidden></button>
  </span>
</header>
<nav id="tabs">
  <button data-t="policy" class="on" data-i18n="tab_policy"></button>
  <button data-t="test" data-i18n="tab_test"></button>
  <button data-t="activity" data-i18n="tab_activity"></button>
  <button data-t="history" data-i18n="tab_history"></button>
</nav>

<main>
  <section class="tab on" id="t-policy">
    <div class="banner" id="loaded-banner"></div>

    <div class="card">
      <h2 data-i18n="sens_title"></h2>
      <p class="sub" data-i18n="sens_sub"></p>
      <div class="grid3" id="sens"></div>
    </div>

    <div class="card">
      <h2 data-i18n="cats_title"></h2>
      <p class="sub" data-i18n="cats_sub"></p>
      <div class="legend">
        <span data-i18n-html="legend_block"></span>
        <span data-i18n-html="legend_ask"></span>
        <span data-i18n-html="legend_allow"></span>
      </div>
      <div id="cats"></div>
    </div>

    <div class="card">
      <h2 data-i18n="rules_title"></h2>
      <p class="sub" data-i18n-html="rules_sub"></p>
      <div class="tpl" id="tpl"></div>
      <div id="rules"></div>
      <button class="btn" id="add-rule" data-i18n="add_rule"></button>
      <p class="hint" data-i18n="rules_tip"></p>
    </div>

    <div class="card">
      <h2 data-i18n="allow_title"></h2>
      <p class="sub" data-i18n="allow_sub"></p>
      <label class="f" data-i18n="allow_domains"></label>
      <div class="chips" data-list="email_domains"><input data-i18n-ph="allow_domains_ph"></div>
      <label class="f" data-i18n="allow_terms"></label>
      <div class="chips" data-list="terms"><input data-i18n-ph="allow_terms_ph"></div>
    </div>

    <div class="card">
      <h2 data-i18n="msg_title"></h2>
      <p class="sub" data-i18n="msg_sub"></p>
      <textarea id="message" data-i18n-ph="msg_ph"></textarea>
    </div>
  </section>

  <section class="tab" id="t-test">
    <div class="card">
      <h2 data-i18n="test_title"></h2>
      <p class="sub" data-i18n-html="test_sub"></p>
      <div class="tpl" id="samples"></div>
      <textarea id="test-text" rows="7" data-i18n-ph="test_ph"></textarea>
      <div style="margin-top: 10px"><button class="btn primary" id="run-test" data-i18n="run_test"></button></div>
    </div>
    <div class="card" id="test-result" hidden></div>
  </section>

  <section class="tab" id="t-activity">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom: 14px">
      <select id="hours"><option value="24" data-i18n="h24"></option><option value="168" data-i18n="d7"></option><option value="720" data-i18n="d30"></option></select>
      <button class="btn" id="reload-stats" data-i18n="refresh"></button>
      <span class="hint" style="margin:0" data-i18n="no_raw"></span>
    </div>
    <div class="tiles" id="tiles"></div>
    <div class="grid3" style="grid-template-columns: 1fr 1fr">
      <div class="card"><h2 data-i18n="by_cat"></h2><p class="sub" data-i18n="by_cat_sub"></p><div class="bars" id="by-cat"></div></div>
      <div class="card"><h2 data-i18n="by_client"></h2><p class="sub" data-i18n="by_client_sub"></p><div class="bars" id="by-client"></div></div>
    </div>
    <div class="card"><h2 data-i18n="recent"></h2><div id="recent"></div></div>
  </section>

  <section class="tab" id="t-history">
    <div class="card">
      <h2 data-i18n="hist_title"></h2>
      <p class="sub" data-i18n="hist_sub"></p>
      <div id="versions"></div>
    </div>
  </section>
</main>

<div class="savebar" id="savebar">
  <span class="msg" data-i18n="unsaved"></span>
  <button class="btn ghost" id="discard" data-i18n="discard"></button>
  <button class="btn primary" id="save" data-i18n="save"></button>
</div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const state = { cfg: null, meta: null, saved: null, draft: null, lang: 'en' };

// ---------- i18n ----------

// ---------- auth (Cognito hosted UI, authorization code + PKCE) ----------
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const jwtClaims = t => JSON.parse(decodeURIComponent(escape(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')))));

async function login() {
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(32)));
  sessionStorage.setItem('pkce', verifier);
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  const q = new URLSearchParams({ response_type: 'code', client_id: state.cfg.clientId, redirect_uri: state.cfg.redirectUri,
    scope: 'openid email', code_challenge_method: 'S256', code_challenge: challenge });
  location.href = `${state.cfg.cognitoDomain}/oauth2/authorize?${q}`;
  return new Promise(() => {});
}

async function ensureLogin() {
  if (state.cfg.mode !== 'cognito') return;
  const code = new URLSearchParams(location.search).get('code');
  if (code) {
    const r = await fetch(`${state.cfg.cognitoDomain}/oauth2/token`, { method: 'POST', headers: { 'content-type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ grant_type: 'authorization_code', client_id: state.cfg.clientId, code, redirect_uri: state.cfg.redirectUri,
        code_verifier: sessionStorage.getItem('pkce') || '' }) });
    const t = await r.json();
    if (t.id_token) sessionStorage.setItem('id_token', t.id_token);
    history.replaceState({}, '', state.cfg.redirectUri);
  }
  const tok = sessionStorage.getItem('id_token');
  if (!tok || jwtClaims(tok).exp * 1000 < Date.now() + 30000) return login();
  $('#who').textContent = jwtClaims(tok).email || '';
  $('#logout').hidden = false;
  $('#logout').onclick = () => {
    sessionStorage.removeItem('id_token');
    location.href = `${state.cfg.cognitoDomain}/logout?${new URLSearchParams({ client_id: state.cfg.clientId, logout_uri: state.cfg.redirectUri })}`;
  };
}

async function api(path, opts = {}) {
  const headers = { 'content-type': 'application/json', 'x-lang': state.lang };
  if (state.cfg.mode === 'cognito') headers.authorization = `Bearer ${sessionStorage.getItem('id_token')}`;
  const r = await fetch(state.cfg.apiBase.replace(/\/$/, '') + path, { ...opts, headers });
  if (r.status === 401) return login();
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || body.message || `HTTP ${r.status}`);
  return body;
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 2600);
}

// ---------- policy tab ----------
const clone = o => JSON.parse(JSON.stringify(o));
const comparable = p => { const c = clone(p); delete c.updated_at; delete c.updated_by; return JSON.stringify(c); };

function renderPolicy() {
  const d = state.draft, m = state.meta;
  $('#sens').innerHTML = m.sensitivities.map(s => `
    <div class="choice ${d.sensitivity === s.id ? 'on' : ''}" data-sens="${s.id}" role="radio" aria-checked="${d.sensitivity === s.id}" tabindex="0">
      <b>${esc(s.label)}</b><span>${esc(T('sens_' + s.id))}</span></div>`).join('');
  $('#cats').innerHTML = m.categories.map(c => `
    <div class="cat"><div class="info"><b>${esc(c.label)}</b><span>${esc(c.desc)}</span></div>
      <div class="seg" data-cat="${c.id}" role="radiogroup" aria-label="${esc(c.label)}">${['block', 'ask', 'allow'].map(v =>
        `<button data-v="${v}" class="${d.categories[c.id] === v ? 'on' : ''}" aria-pressed="${d.categories[c.id] === v}">${T('act_' + v)}</button>`).join('')}</div></div>`).join('');
  $('#rules').innerHTML = d.custom_rules.length ? d.custom_rules.map((r, i) => `
    <div class="rule ${r.enabled ? '' : 'off'}" data-i="${i}">
      <div class="row">
        <label style="display:flex;gap:6px;align-items:center;white-space:nowrap"><input type="checkbox" data-k="enabled" ${r.enabled ? 'checked' : ''}> ${T('rule_on')}</label>
        <input type="text" data-k="name" value="${esc(r.name)}" placeholder="${esc(T('rule_name_ph'))}">
        <select data-k="action">${['block', 'ask'].map(v => `<option value="${v}" ${r.action === v ? 'selected' : ''}>${T('act_' + v)}</option>`).join('')}</select>
        <select data-k="sensitivity">${m.sensitivities.map(s => `<option value="${s.id}" ${r.sensitivity === s.id ? 'selected' : ''}>${esc(T('rule_sens', { s: s.label }))}</option>`).join('')}</select>
        <button class="btn ghost" data-del>${T('delete')}</button>
      </div>
      <textarea data-k="question" rows="2" placeholder="${esc(T('rule_q_ph'))}">${esc(r.question)}</textarea>
    </div>`).join('') : `<p class="empty">${T('no_rules')}</p>`;
  for (const el of $$('.chips')) {
    const key = el.dataset.list;
    $$('.chip', el).forEach(c => c.remove());
    el.insertAdjacentHTML('afterbegin', d.allow[key].map((v, i) => `<span class="chip">${esc(v)}<button data-rm="${i}" aria-label="${T('delete')}">×</button></span>`).join(''));
  }
  if (document.activeElement !== $('#message')) $('#message').value = d.message || '';
  $('#ver').textContent = state.saved.updated_at
    ? T('last_saved', { t: fmtTime(state.saved.updated_at), by: state.saved.updated_by ? ' · ' + state.saved.updated_by : '' })
    : T('default_policy');
  markDirty();
}

function markDirty() {
  $('#savebar').classList.toggle('on', comparable(state.draft) !== comparable(state.saved));
}

function bindPolicy() {
  $('#sens').addEventListener('click', e => { const c = e.target.closest('[data-sens]'); if (!c) return; state.draft.sensitivity = c.dataset.sens; renderPolicy(); });
  $('#sens').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset.sens) { e.preventDefault(); e.target.click(); } });
  $('#cats').addEventListener('click', e => { const b = e.target.closest('button[data-v]'); if (!b) return; state.draft.categories[b.parentElement.dataset.cat] = b.dataset.v; renderPolicy(); });
  $('#tpl').addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (b) addRule(TEMPLATES[state.lang][b.dataset.t]); });
  $('#add-rule').onclick = () => addRule({ name: '', question: '' });
  const rules = $('#rules');
  rules.addEventListener('input', e => {
    const k = e.target.dataset.k, i = e.target.closest('[data-i]')?.dataset.i; if (!k || i == null) return;
    state.draft.custom_rules[i][k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
    if (k === 'enabled') e.target.closest('.rule').classList.toggle('off', !e.target.checked);
    markDirty();
  });
  rules.addEventListener('click', e => { if (!e.target.hasAttribute('data-del')) return; state.draft.custom_rules.splice(e.target.closest('[data-i]').dataset.i, 1); renderPolicy(); });
  for (const el of $$('.chips')) {
    const key = el.dataset.list, input = $('input', el);
    input.addEventListener('keydown', e => {
      if ((e.key === 'Enter' || e.key === ',') && input.value.trim()) {
        e.preventDefault();
        const v = input.value.trim().replace(/^@/, '');
        if (!state.draft.allow[key].includes(v)) state.draft.allow[key].push(v);
        input.value = ''; renderPolicy(); $('input', el).focus();
      }
    });
    el.addEventListener('click', e => { if (e.target.dataset.rm == null) return input.focus(); state.draft.allow[key].splice(e.target.dataset.rm, 1); renderPolicy(); });
  }
  $('#message').addEventListener('input', e => { state.draft.message = e.target.value; markDirty(); });
  $('#discard').onclick = () => { state.draft = clone(state.saved); $('#loaded-banner').classList.remove('on'); renderPolicy(); };
  $('#save').onclick = save;
}

function addRule(t) {
  state.draft.custom_rules.push({ id: 'r' + Date.now().toString(36), name: t.name, question: t.question, action: 'block', sensitivity: 'balanced', enabled: true });
  renderPolicy();
  $$('#rules textarea').at(-1)?.focus();
}

async function save() {
  $('#save').disabled = true;
  try {
    const r = await api('/api/policy', { method: 'PUT', body: JSON.stringify({ policy: state.draft }) });
    state.saved = r.policy; state.draft = clone(r.policy);
    $('#loaded-banner').classList.remove('on');
    renderPolicy();
    toast(T('saved_toast'));
  } catch (e) { toast(T('save_failed', { e: e.message })); }
  $('#save').disabled = false;
}

// ---------- test tab ----------
function friendlyReason(f) {
  const L = state.meta.labels, pct = x => Math.round(x * 100);
  if (f.source === 'rule') return T('r_rule', { name: esc(f.name), p: pct(f.p) });
  if (f.source === 'regex') return T('r_regex', { label: esc(L[f.type] || f.type), sample: esc(f.sample) });
  return T('r_model', { label: esc(L[f.type] || f.type), s: pct(f.kind_confidence), n: pct(f.p_named) });
}

async function runTest() {
  const box = $('#test-result');
  box.hidden = false; box.innerHTML = `<p class="empty">${T('checking')}</p>`;
  try {
    const r = await api('/api/test', { method: 'POST', body: JSON.stringify({ text: $('#test-text').value, policy: state.draft }) });
    const res = r.results[0] || { findings: [], latency_ms: 0 };
    const icon = { block: '✕', ask: '!', allow: '✓' }[r.decision];
    const findings = r.decision === 'allow' ? [] : res.findings;
    box.innerHTML = `<div class="verdict ${r.decision}"><i>${icon}</i>${T('v_' + r.decision)}</div>
      ${findings.length ? `<ul class="reasons">${findings.map(f => `<li>${friendlyReason(f)}</li>`).join('')}</ul>` : `<p class="sub" style="margin-top:12px">${T('nothing_found')}</p>`}
      <p class="hint">${T('took', { ms: Math.round(res.latency_ms) })}${r.decision === 'ask' ? T('ask_note') : ''}</p>`;
  } catch (e) { box.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

// ---------- activity tab ----------
function catLabel(key) {
  if (key.startsWith('rule:')) return T('rule_prefix') + key.slice(5);
  return state.meta.categories.find(c => c.id === key)?.label || state.meta.labels[key] || key;
}

function bars(el, rows, labelOf) {
  if (!rows.length) { el.innerHTML = `<p class="empty">${T('no_data')}</p>`; return; }
  const max = Math.max(...rows.map(r => r.n));
  el.innerHTML = rows.map(r => `<div class="b" data-tip="${esc(labelOf(r.key))}: ${esc(T('count', { n: fmtNum(r.n) }))}">
    <span class="name">${esc(labelOf(r.key))}</span><span class="track"><span class="fill" style="width:${(r.n / max * 100).toFixed(1)}%"></span></span>
    <span class="num">${fmtNum(r.n)}</span></div>`).join('');
}

  $('#tiles').innerHTML = `<p class="empty">${T('loading')}</p>`;
  try {
    const s = await api(`/api/stats?hours=${$('#hours').value}`);
    $('#tiles').innerHTML = `
      <div class="tile"><div class="k">${T('total')}</div><div class="v">${fmtNum(s.total)}</div></div>
      <div class="tile"><div class="k"><span class="dot block"></span>${T('blocked')}</div><div class="v">${fmtNum(s.block)}</div></div>
      <div class="tile"><div class="k"><span class="dot ask"></span>${T('asked')}</div><div class="v">${fmtNum(s.ask)}</div></div>`;
    bars($('#by-cat'), s.by_category, catLabel);
    bars($('#by-client'), s.by_client, k => CLIENT_LABEL[k] || k);
    $('#recent').innerHTML = s.recent.length ? `<table><thead><tr><th>${T('col_time')}</th><th>${T('col_decision')}</th><th>${T('col_tool')}</th><th>${T('col_target')}</th><th>${T('col_reason')}</th><th style="text-align:right">ms</th></tr></thead><tbody>
      ${s.recent.map(e => `<tr><td>${esc(fmtTime(e.ts))}</td>
        <td><span class="pill"><span class="dot ${e.decision}"></span>${T(e.decision === 'block' ? 'v_block' : 'v_ask')}</span></td>
        <td>${esc(CLIENT_LABEL[e.client] || e.client || '-')}</td><td>${esc(e.sources || '')}</td>

async function loadVersion(id, when) {

  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t));

function bindTooltips() {
  const tip = $('#tip');
  document.addEventListener('mousemove', e => {
    const el = e.target.closest('[data-tip]');
    if (!el) { tip.style.display = 'none'; return; }
    tip.textContent = el.dataset.tip; tip.style.display = 'block';
    tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px'; tip.style.top = (e.clientY + 14) + 'px';
  });
}

async function main() {
  const q = new URLSearchParams(location.search).get('lang');
  state.lang = [q, localStorage.getItem('lang'), (navigator.language || '').slice(0, 2)].find(l => l in I18N) || 'en';
  state.cfg = await (await fetch('config.json', { cache: 'no-store' })).json();
  applyStatic();
  await ensureLogin();
  const r = await api('/api/policy');
  state.meta = r.meta; state.saved = r.policy; state.draft = clone(r.policy);
  bindPolicy(); renderPolicy(); bindTooltips();
  $('#lang').addEventListener('click', e => { const b = e.target.closest('[data-lang]'); if (b) setLang(b.dataset.lang); });
  $('#tabs').addEventListener('click', e => { const b = e.target.closest('button[data-t]'); if (b) { history.replaceState({}, '', location.pathname + location.search + '#' + b.dataset.t); showTab(b.dataset.t); } });
  $('#samples').addEventListener('click', e => { const b = e.target.closest('[data-s]'); if (b) $('#test-text').value = SAMPLES[state.lang][b.dataset.s].text; });
  $('#run-test').onclick = runTest;
  $('#reload-stats').onclick = loadStats; $('#hours').onchange = loadStats;
  $('#versions').addEventListener('click', e => { const b = e.target.closest('[data-load]'); if (b) loadVersion(b.dataset.load, b.dataset.when); });
  addEventListener('beforeunload', e => { if (comparable(state.draft) !== comparable(state.saved)) e.preventDefault(); });
  const first = location.hash.slice(1);
  if (['test', 'activity', 'history'].includes(first)) showTab(first);
}
main().catch(e => { document.querySelector('main').innerHTML = `<div class="card"><p class="err">${esc(e.message)}</p></div>`; });
</script>
</body>
</html>
